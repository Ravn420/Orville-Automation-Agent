<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Orville Browser Operator</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      margin: 0;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }
    .icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
    }
    h1 {
      margin: 0;
      font-size: 14px;
      color: #fff;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(0,0,0,0.3);
      margin-bottom: 12px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
    }
    .status-dot.inactive {
      background: #ef4444;
      box-shadow: 0 0 6px #ef4444;
    }
    .status-dot.pending {
      background: #f59e0b;
      box-shadow: 0 0 6px #f59e0b;
    }
    .status-text {
      font-size: 12px;
      color: #ccc;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      background: #667eea;
      color: white;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #7c8ce0;
    }
    button:disabled {
      background: #444;
      cursor: not-allowed;
    }
    .info {
      margin-top: 12px;
      padding: 8px 10px;
      background: rgba(0,0,0,0.2);
      border-radius: 6px;
      font-size: 11px;
      color: #999;
    }
    .relay-url {
      font-family: monospace;
      word-break: break-all;
    }
    .muted {
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <div class="icon">O</div>
    <h1>Orville Browser Operator</h1>
  </header>

  <div class="status" id="status">
    <div class="status-dot inactive" id="status-dot"></div>
    <span class="status-text" id="status-text">Connecting...</span>
  </div>

  <div class="buttons">
    <button id="btn-extract" disabled>Extract Page Data</button>
    <button id="btn-screenshot" disabled>Capture Screenshot</button>
    <button id="btn-checkin" disabled>Check in Agent</button>
  </div>

  <div class="info">
    <div>Relay: <span class="relay-url muted" id="relay-url">ws://localhost:8766</span></div>
    <div style="margin-top: 4px">Page: <span class="muted" id="page-domain">-</span></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
