name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,browser,media,security,dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run type check
        run: python -m py_compile orville_core/**/*.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint
          pip install -e ".[api,browser,media,security,dev]"

      - name: Lint with flake8
        run: flake8 orville_core --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check Python compilation
        run: |
          python -m py_compile orville_core/**/*.py
